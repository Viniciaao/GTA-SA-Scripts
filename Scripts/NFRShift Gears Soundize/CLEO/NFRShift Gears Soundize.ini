; ============================================================================
; NFRShift Gears Soundize - configuracao
; ----------------------------------------------------------------------------
; Esse arquivo e criado automaticamente pelo script, mas vc pode editar
; qualquer valor com o jogo aberto (o script le quase tudo na hora).
; ============================================================================

[config]
; Estabilizar a alavanca do mouse em FPS alto/instavel:
; 0 = mouse cru (padrao do mod original) | 1 = mouse por tempo (frame independent)
FPSstableMode = 0

; Mostrar o painel de marcha no canto direito (marcha selecionada + marcha do som)
GearHelper = 1

; Barra de RPM em tempo real no pe da tela (usa o RPM real do Soundize;
; so aparece enquanto o carro estiver tocando um banco de som do Soundize)
ShowRPMBar = 1

; 1 = SEM a animacao de "pular marcha" (o boneco nao faz o movimento de
;     trocar a alavanca). USE 1 SE VOCE USA VEHIK (zzpuma): o VehIK ja anima
;     a mao do motorista no cambio sozinho, e a animacao antiga briga com ele.
; 0 = animacao original do mod (so faz sentido sem VehIK)
DisableShiftAnim = 1

; Como calcular o limite de velocidade de cada marcha:
; 0 = janela de marcha da handling do carro (aGears.fChangeUpVelocity)
;     RECOMENDADO: e o mesmo dado que o Soundize/audio do jogo usam pra
;     calcular marcha, entao tudo fica sincronizado em qualquer carro.
; 1 = proporcional: velocidade maxima do carro / numero de marchas (estilo antigo)
; 2 = tabela fixa em km/h do mod original (25/60/85/110/140/310 km/h)
GearLimitMode = 0

; Onde fica o corte-giro (rev limiter) de cada marcha, em fracao do ponto de
; troca. 0.97 = acelerando em qualquer marcha o carro puxa ATÉ O TALO e o RPM
; fica cravado no limite (barulhinho de corte-giro), igual na vida real — o
; carro não sobe de marcha sozinho porque nunca cruza o ponto de troca.
; Se o carro ainda subir de marcha sozinho, baixe pra 0.9; se quiser o corte
; mais cedo (estilo econômico), 0.8.
ShiftThreshold = 0.97

; Falta de velocidade pra marcha (embreagem solta): se a velocidade cair
; abaixo de (faixa minima da marcha x este fator), o motor labuta e MORRE.
; Ex.: parou no 4 em 5 km/h e soltou tudo = morre, tem que embreagar e reducir.
; 0.5 = padrao | maior (0.7) = morre mais facil | 0 = desativa
StallSpeedFactor = 0.5

; Dano leve no motor a cada tranco de partida FALHADO (ligar em marcha sem
; embreagem e o carro afogar). 6.0 = padrao | 0 = desativa o dano.
; O motor fuma conforme a vida dele cai; o dano nao derruba abaixo do
; limite de pega-fogo (251).
StarterDamage = 6.0

; Acelerar com a embreagem pisada OU no ponto morto: simula o motor
; girando (rev) pela velocidade interna da transmissao. O som padrao do
; jogo acompanha; o Soundize tambem acompanha quando calcula o RPM por essa
; velocidade. NAO usa freio: com a embreagem pisada o carro fica solto,
; desacelerando so de arrasto (nada de frear ao passar marcha).
ClutchRevSim = 1

; Partida realista (vale pra som do Soundize e do jogo):
; 1 = - ligar com o carro PARADO EM MARCHA apertando E (sem embreagem):
;       o carro da o tranco com a forca dele e o motor MORRE (afoga)
;     - ligar em PONTO MORTO: o motor fica ligado, como na vida real
;     - ROLANDO em marcha (>= ~7 km/h) + E: pega no tranco (bump start)
;     - pisar a embreagem durante o tranco salva o engate
; 0 = E liga o motor direto em qualquer condicao (sem realismo)
RealisticStart = 1

[Soundize]
; 1 = usar a API do Soundize (RPM/marcha reais no HUD, integragao de audio)
; 0 = tratar todo carro como audio vanilla
Enabled = 1

; 1 = escrever a marcha escolhida na marcha REAL do jogo
;     (CVehicle.m_nCurrentGear, +0x4B4). O Soundize usa as marchas do jogo
;     e nao muda a fisica — entao fisica e som passam a seguir o cambio
;     manual: largada parado na 5a tem a fisica fraca de 5a e o som toca na
;     5a baixa, sem passar marchas sozinho. Quase nao tem motivo pra por 0.
WriteGearToGame = 1

; 1 = cravar a marcha escolhida no byte de marcha da entidade de audio do
; jogo (CAEVehicleAudioEntity+0xAA) - cobre o som vanilla e o engate de
; neutro/re. Deixe 1.
WriteGearToAudio = 1

; Quando o carro NAO esta usando som do Soundize (banco nativo do jogo):
; 1 = zerar os campos do efeito de troca de marcha do audio vanilla,
;     igual o mod original fazia (nao toca o "toc" do cambio do jogo)
; 0 = deixar o efeito de troca de marcha vanilla tocar normal
InhibitShiftFxVanilla = 1

[Manual]
; Tecla da embreagem (codigo virtual-key do Windows). 160 = Shift esquerdo.
ManualClutchKey = 160

; Largura do marcador da alavanca (bolinha branca do mouse)
gPointerWidth = 49.0

; Sensibilidade do movimento da alavanca (maior = alavanca mais lenta)
PointerSensibility = 6.0

; Modo de aceleracao em marchas baixas (0 padrao, 1/2 = aceleracao mais fraca)
Acceleration = 0

; Posicao do painel de marchas de moto/quad (canto, resolucao 640x480)
BikeGearPosX = 500.0
BikeGearPosY = 350.0

; Deslocamento do painel da alavanca em H (carros), resolucao 640x480
ManualSpriteX = 0.0
ManualSpriteY = 0.0
