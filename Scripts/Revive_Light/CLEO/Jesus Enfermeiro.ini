; ============================================================================
; Jesus Enfermeiro - configuracao
; ============================================================================
; Coloque este arquivo em CLEO\Jesus Enfermeiro.ini (junto do .cs).
; Ele e lido uma unica vez, quando o script entra em execucao (carregar um
; save ou abrir uma partida). Depois de editar, recarregue o save para valer.
;
; A lista de modelos usa NOME do modelo, nunca ID. Serve para medicos
; originais e tambem para peds adicionados (ModLoader / .ide), desde que o
; nome exista no jogo:
;     LAEMT1 = enfermeiro de Los Santos   (o mod original)
;     NURSE1 = qualquer ped seu que use esse nome
; Nome que nao existe e ignorado (o script avisa na tela na primeira leitura).
;
; Comentarios comecam com ; ou #.
; ============================================================================


[Settings]

; Tipo de luz VANILLA (quando Proper Shaders NAO esta instalado, ou
; UseProperShaders = 0):
;   0 = facho de searchlight, igual ao mod original (padrao)
;   1 = brilho (corona) com cor configuravel - nao gasta searchlight
;   2 = os dois (facho + brilho)
; Com Proper Shaders ativo a luz principal e per-pixel; Type 1/2 ainda
; desenha a corona por cima se quiser o "brilho" na tela.
Type = 0

; Altura da luz de searchlight acima do NPC, em metros (original: 30.0).
; NAO afeta a luz do Proper Shaders (use PsOffsetZ).
Height = 30.0

; Raios do cone do facho, em metros. Estes valores sao os mesmos do mod
; original - mexer neles muda o formato do cone (trocar os dois de lugar
; inverte o facho).
Radius1 = 0.0
Radius2 = 2.5

; Tamanho do brilho/corona (usado no Type 1 e 2)
GlowSize = 0.9

; Cor da luz: Vermelho Verde Azul (0-255).
; - corona (Type 1/2)
; - luz per-pixel do Proper Shaders (convertida pra 0..1)
Color = 255 240 180

; 1 = acende somente enquanto o NPC esta reanimando alguem (animacao "CPR"),
; que e o comportamento do mod original. 0 = sempre aceso.
OnlyWhenReviving = 0

; Quantas searchlights o jogo aguenta ao mesmo tempo (so no fallback vanilla).
;   7   = jogo original (o array do jogo tem 8 vagas)
;   120 = se voce usa Searchlight Limit Adjuster / limit adjuster de searchlights
; O script nunca cria luz acima desse numero (o jogo escreve fora do array
; quando acaba a vaga - nao mexa se nao souber o que esta fazendo).
MaxLights = 7


; ============================================================================
; PROPER SHADERS (luz per-pixel deferred)
; ============================================================================
; Requer Proper Shaders com a API publica (versao 09-26+ / ProperShaders.asi
; exportando PS_LightCreate). Documentacao:
;   https://github.com/MixMods/ProperShadersApiExample
;
; Se o ASI nao estiver carregado, o mod cai no Type/searchlight/corona acima
; sem reclamar (so nao mostra o aviso verde de "API ativa").

; 1 = tenta usar a API do Proper Shaders (recomendado). 0 = forca vanilla.
UseProperShaders = 1

; Tipo da luz PS: 0 = ponto (omni, ilumina em volta)  |  1 = spot (cone pra baixo)
PsType = 0

; Raio em metros ate a luz sumir. Custo cresce com a area na tela - prefira
; raio menor + intensity maior do que uma bola enorme e fraca.
; (fog volumetrica ignora raios > ~80 e < 0.5)
PsRadius = 12.0

; Intensidade (1.0 ~= luz normal do jogo nesse raio). Suba pra brilhar mais
; do que branco; NAO estoure Color acima de 255.
PsIntensity = 2.5

; Altura da luz no corpo do NPC (metros acima dos pes). 1.2 ~= peito/cabeca.
; Diferente de Height (que e o holofote la de cima no modo vanilla).
PsOffsetZ = 1.2

; Fog volumetrica: 0 = so ilumina superficie  |  1 = tambem brilha na neblina
; (custa 1 vaga do budget de 12 fog-lights por quadro).
PsFog = 1


; ============================================================================
; SE O JOGO ESTIVER CRASHANDO
; ============================================================================
; 1) Coloque UseProperShaders = 0 e Type = 1: so corona, zero searchlight e
;    zero API. Se parar de crashar, isole se era PS ou searchlight.
; 2) Tire o "Jesus Enfermeiro.cs" da pasta CLEO e veja se o crash continua.
; 3) O log do SCRLog (SCRLog.log) e o ProperShaders.log ajudam a achar o
;    culpado.


[Models]

; Um modelo por linha. Tambem vale "NOME = 1", e da para comentar no fim da
; linha: "LAEMT1 ; enfermeiro de LS".
;
; Originais do mod (medicos de Los Santos, San Fierro e Las Venturas):
LAEMT1
SFEMT1
LVEMT1

; Exemplos de como adicionar outros peds (descomente e troque pelo seu):
;NURSE
;JESUS
;MY_NURSE_MODEL
