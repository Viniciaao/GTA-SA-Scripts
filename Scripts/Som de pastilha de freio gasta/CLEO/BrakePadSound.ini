; ============================================================================
; Som de pastilha de freio gasta v2.7 (CLEO+, edicao NPCs)
; ----------------------------------------------------------------------------
; Este arquivo e' lido UMA vez, quando o jogo abre. Da para editar com o jogo
; fechado (ou aberto: precisando reiniciar o jogo para mudar).
; Se voce apagar uma chave, o script recria ela com o valor padrao.
; ============================================================================

[Config]

; ---------------------------------------------------------------------------
; Ligado/desligado
; ---------------------------------------------------------------------------
; 1 = o mod funciona | 0 = o script fica parado (nao gasta cpu nenhuma)
Enabled = 1

; ---------------------------------------------------------------------------
; QUAIS CARROS CHIAM
; ---------------------------------------------------------------------------
; O valor do carro e' lido DIRETO da handling do jogo (o mesmo valor
; monetario que o jogo usa no missao de exportar veiculos). O script nao tem
; lista de carros: qualquer carro - inclusive os added - vale.
;
; MinValue / MaxValue sao o "corte": so carro dentro dessa faixa chia.
; Padrao: 0 ate 32000, ou seja, os carros velhos/baratos. Um Infernus, uma
; Bullet ou uma Super GT (valores de 80 a 150 mil) ficam de fora; um Bandito, um
; FCR-900, um Perennial ou uma picareta velha chiando no meio do transito,
; nao.
;
; Para mudcar o valor de um carro especifico, mexa no data/handling.cfg
; (coluna "Monetary Value" da handling do carro). Com Debug = 1 o script
; imprime o valor de cada carro novo que aparece, o que ajuda a escolher o
; corte certo.
MinValue = 0
MaxValue = 32000

; ---------------------------------------------------------------------------
; TIPOS DE VEICULO
; ---------------------------------------------------------------------------
; 0 = so carros (inclui van, caminhao e onibus) - recomendado
; 1 = carros + motos e quadriciclos
; Aereo (aviao/helicoptero) e aquatico (barco) nunca chiam, em nenhum modo:
; o "freio" deles nao tem pastilha.
Vehicles = 0

; ---------------------------------------------------------------------------
; SOM
; ---------------------------------------------------------------------------
; Volume do chiado (0.0 a 1.0). O volume final ainda e' multiplicado pelo
; volume de efeitos do jogo (Configuracoes > Audio), pela pressao do pedal e
; pela velocidade - entao este valor e' o "teto".
Volume = 0.7

; Distancia (em metros) da camera em que o som ainda pode ser disparado.
; Fora disso o carro nem e' analisado. Maior = mais carros, mais cpu.
Radius = 70.0

; Caminho do arquivo de som (wav ou mp3). Coloque o seu arquivo em
; CLEO\BrakePadSound\ e aponte aqui. Se o arquivo nao existir, o script avisa
; na tela e nao roda.
SoundFile = CLEO\BrakePadSound\brakepad.wav

; ---------------------------------------------------------------------------
; COMO O PEDAL VIRA CHIADO
; ---------------------------------------------------------------------------
; Pedal minimo (0.0 a 1.0) para contar como freada. Abaixo disso o carro e'
; considerado parado/acelerando. 0.15 = 15% do pedal.
BrakeThreshold = 0.15

; Pressao acumulada minima (0.0 a 1.0) para soltar o som. Uma franada de
; Accelerate antes de soltar o freio nao chega aqui e nao chia - foi assim que
; o script original evitava o chiado falso quando o carro so estava encostando
; no freio. Menor = mais chiado.
TriggerPressure = 0.08

; Velocidade (por segundo) com que a pressao sobe enquanto o freio esta
; apertado. Maior = o chiado aparece mais rapido num toque curto. 5.0 = sobe
; de 0 a 1 em um-fiftho de segundo pisando o pedal inteiro.
PressureRate = 5.0

; ---------------------------------------------------------------------------
; VELOCIDADE E REPETICAO
; ---------------------------------------------------------------------------
; Velocidade de referencia (km/h). Duas coisas saem daqui:
;   - abaixo de 12% dela (13 km/h com o padrao) o carro nao chia, porque
;     pastilha gasta nao canta com o carro parado;
;   - o volume sobe junto com a velocidade, ate 100% em RefSpeed.
; O 3.6 do script (GET_CAR_SPEED x 3.6) e' a conversao para km/h: o jogo
; devolve a velocidade em "~m/s".
RefSpeed = 110.0

; Velocidade minima (km/h) para o carro chiar. Abaixo disso o script zera a
; pressao: pastilha gasta nao canta com o carro parado, e aquele barulho de
; "arrastando o freio" no sinal nao engana ninguem.
;   0  = canta mesmo parado (util para testar o som sem sair do lugar)
;   10 = padrao: comeca a cantar ja numa velocidade de rua
MinSpeed = 10.0

; Intervalo (ms) entre um chiado e o seguinte do MESMO carro.
;   0    = um chiado por aperto no freio (comportamento da v2.5.1). O carro
;          fica travado depois de cantar e so volta a cantar quando o freio for
;          solto de verdade - com um piso de 250 ms, para o pedaidinho da IA
;          nao virar metralhadeira.
;   1100 = repete enquanto o freio estiver apertado, como a pastilha de verdade
;   2000 = repete, mais espacado
; O padrao (1500) fica um pouco acima da duracao do brakepad.wav (1,2 s), para
; cada chiado comecar e terminar bem definido em vez de se sobrepor ao anterior.
Cooldown = 1500

; ---------------------------------------------------------------------------
; DEBUG
; ---------------------------------------------------------------------------
; 1 = imprime na tela o valor de cada carro assim que ele passa pelo script
; (bom pra descobrir o corte de MaxValue). 0 = nada.
Debug = 0
