; ============================================================================
; Som de pastilha de freio gasta v2.9 (CLEO+, edicao NPCs)
; ----------------------------------------------------------------------------
; Este arquivo e' lido UMA vez, quando o jogo abre. Da para editar com o jogo
; fechado (ou aberto: precisando reiniciar o jogo para mudar).
; Se voce apagar uma chave, o script recria ela com o valor padrao.
; ============================================================================

[Config]

; ---------------------------------------------------------------------------
; Ligado/desligado
; ---------------------------------------------------------------------------
; 1 = o mod funciona | 0 = o script fica parado (nao gasta cpu nenhuma)
Enabled = 1

; ---------------------------------------------------------------------------
; QUAIS CARROS CHIAM
; ---------------------------------------------------------------------------
; O valor do carro e' lido DIRETO da handling do jogo (o mesmo valor
; monetario que o jogo usa no missao de exportar veiculos). O script nao tem
; lista de carros: qualquer carro - inclusive os added - vale.
;
; MinValue / MaxValue sao o "corte": so carro dentro dessa faixa chia.
; Padrao: 0 ate 32000, ou seja, os carros velhos/baratos. Um Infernus, uma
; Bullet ou uma Super GT (valores de 80 a 150 mil) ficam de fora; um Bandito, um
; FCR-900, um Perennial ou uma picareta velha chiando no meio do transito,
; nao.
;
; Para mudar o valor de um carro especifico, mexa no data/handling.cfg
; (coluna "Monetary Value" da handling do carro).
MinValue = 0
MaxValue = 32000

; ---------------------------------------------------------------------------
; TIPOS DE VEICULO
; ---------------------------------------------------------------------------
; 0 = so carros (inclui van, caminhao e onibus) - recomendado
; 1 = carros + motos e quadriciclos
; Aereo (aviao/helicoptero) e aquatico (barco) nunca chiam, em nenhum modo:
; o "freio" deles nao tem pastilha.
Vehicles = 0

; ---------------------------------------------------------------------------
; SOM
; ---------------------------------------------------------------------------
; Volume do chiado (0.0 a 1.0). O volume final ainda e' multiplicado pelo
; volume de efeitos do jogo (Configuracoes > Audio), pela pressao do pedal e
; pela velocidade - entao este valor e' o "teto".
Volume = 0.5

; Distancia (em metros) da camera em que o som ainda pode ser disparado.
; Fora disso o carro nem e' analisado. Maior = mais carros, mais cpu.
Radius = 70.0

; Caminho do arquivo de som (wav ou mp3). Coloque o seu arquivo em
; CLEO\BrakePadSound\ e aponte aqui. Se o arquivo nao existir, o script avisa
; na tela e nao roda.
; O motor de audio do jogo trabalha em 22050 Hz: um .wav mono 22050 Hz toca
; limpo. MP3 tambem funciona (o mod original usa mp3).
; O script NAO depende da duracao do arquivo: um chiado de 1 s ou de 10 s
; funciona igual (veja a chave Fade).
SoundFile = CLEO\BrakePadSound\brakepad.mp3

; ---------------------------------------------------------------------------
; COMO A FRENAGEM VIRA CHIADO
; ---------------------------------------------------------------------------
; O gatilho e' a DESACELERACAO do carro, como no mod original: o script mede
; quanto o carro perdeu de velocidade neste frame e canta quando a perda passa
; de BrakeForce. Por isso:
;   - freando a 80 km/h, chiado na hora, como na vida real;
;   - com o carro PARADO, NAO acontece nada (um carro parado nao desacelera),
;     mesmo com o pe no freio - a cantiga so aparece quando o carro esta
;     mesmo freando;
;   - freada de leve quase nao canta; batida forte canta alto e longo.
;
; E, o mais importante: o som e' da FRENAGEM. Ele nasce quando a frenagem
; comeca, acompanha o volume enquanto ela dura, e morre quando ela acaba
; (veja Fade).

; Pedal minimo (0.0 a 1.0) para contar como freada. Abaixo disso o script
; ignora o carro. 0.15 = 15% do pedal. (E' a trava contra falso positivo:
; so conta frenagem com pe mesmo no freio.)
BrakeThreshold = 0.15

; Queda minima de velocidade (em m/s2, isto e', em "g") para o chiado contar.
; O carro freando de verdade passa facil; um encostinho no freio nao chega.
;   2.5 = padrao
;   1.0 = mais sensivel (mais carros, mais vezes)
;   6.0 = so batida forte (mais seletivo)
; 0.0 = qualquer queda de velocidade conta, com o pe no freio.
BrakeForce = 2.5

; ---------------------------------------------------------------------------
; FIM DO SOM
; ---------------------------------------------------------------------------
; Em quantos SEGUNDOS o som desaparece quando a frenagem acaba - quando voce
; solta o freio, quando o carro para de frear ou quando o carro para de vez.
; O script desvanece o volume ate zero nesse tempo e so entai desliga e
; remove o som de verdade, entao o chiado nao fica soando depois da freada.
;   0.2 = padrao (um quinto de segundo: some antes de voce perceber)
;   0.0 = corte seco, sem desvanecer (so use se o seu arquivo estalar no fim)
;   0.5 = mais lento, se o seu arquivo tiver um "rastro" no fim
; O mesmo tempo vale para o comeco (o som tambem sobe devagar).
Fade = 0.2

; ---------------------------------------------------------------------------
; VELOCIDADE
; ---------------------------------------------------------------------------
; Velocidade de referencia (km/h). O volume do chiado sobe junto com a
; velocidade, ate 100% em RefSpeed (e nunca abaixo de 25%).
; O 3.6 do script (GET_CAR_SPEED x 3.6) e' a conversao para km/h: o jogo
; devolve a velocidade em "~m/s".
RefSpeed = 110.0
